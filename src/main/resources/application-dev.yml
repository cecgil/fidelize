spring:
  datasource:
    url: jdbc:h2:mem:loyaltydb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

  # SMTP desabilitado em dev — o EmailService faz fallback para log no console
  mail:
    host: localhost
    port: 25
