<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Erro')}"></head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4">

<div class="w-full max-w-sm">
    <div class="bg-white rounded-2xl p-6 shadow-sm text-center">

        <div class="w-16 h-16 bg-red-50 rounded-2xl flex items-center justify-center mx-auto mb-4">
            <span class="text-3xl">⚠️</span>
        </div>
        <h2 class="text-xl font-black text-gray-900 mb-2" th:text="${titulo}">Erro</h2>
        <p class="text-gray-500 text-sm mb-6" th:text="${mensagem}">Mensagem</p>

        <a href="/admin/painel"
           class="block py-4 bg-primary hover:opacity-90 text-white rounded-xl font-bold text-base text-center">
            Voltar ao painel
        </a>
    </div>
</div>

</body>
</html>
