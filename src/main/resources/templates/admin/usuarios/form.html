<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Novo usuário')}"></head>
<body class="bg-gray-50 min-h-screen">

<th:block th:replace="~{fragments/nav-admin :: nav}"></th:block>

<div class="max-w-lg mx-auto px-4 pt-6 pb-2">
    <p class="font-bold text-xs uppercase tracking-widest mb-1" style="color:#4f46e5">Equipe</p>
    <h1 class="text-2xl font-black text-gray-900 mb-5">Novo usuário</h1>
</div>

<div class="max-w-lg mx-auto px-4 pb-6">
    <div class="bg-white rounded-2xl p-6 shadow-sm">

        <form method="post" th:action="@{/admin/usuarios}">
            <label>Usuário</label>
            <input type="text" name="username" placeholder="nome de usuário" required>

            <label>Senha</label>
            <input type="password" name="senha" placeholder="mínimo 6 caracteres" required>

            <label>Nível de acesso</label>
            <select name="role" required>
                <option th:each="r : ${roles}"
                        th:value="${r}"
                        th:text="${r.name() == 'ADMIN' ? 'Administrador' : 'Funcionário'}">
                </option>
            </select>

            <button type="submit"
                    class="w-full py-4 bg-primary hover:opacity-90 text-white rounded-xl font-bold text-base cursor-pointer border-0">
                Criar usuário
            </button>
        </form>

        <a href="/admin/usuarios"
           class="block text-center text-sm text-gray-400 hover:text-gray-600 mt-4">
            ← Voltar
        </a>
    </div>
</div>

</body>
</html>
