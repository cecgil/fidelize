<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Novo usuario')}"></head>
<body class="bg-gray-50 min-h-screen font-sans">

<div class="admin-layout">
    <th:block th:replace="~{fragments/nav-admin :: nav}"></th:block>

    <main class="admin-content">
        <div class="max-w-2xl mx-auto px-4 sm:px-6 py-6 animate-fade-in">

            <div class="mb-6">
                <a href="/admin/usuarios" class="text-sm text-gray-400 hover:text-gray-600 font-medium inline-flex items-center gap-1 mb-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
                    </svg>
                    Voltar
                </a>
                <h1 class="text-2xl font-black text-gray-900">Novo usuario</h1>
                <p class="text-sm text-gray-400 mt-0.5">Adicione um membro a sua equipe</p>
            </div>

            <div class="bg-white rounded-2xl p-6 shadow-sm">
                <form method="post" th:action="@{/admin/usuarios}">
                    <div class="space-y-4">
                        <div>
                            <label class="text-sm font-semibold text-gray-700 mb-2 block">Usuario</label>
                            <input type="text" name="username" placeholder="nome de usuario" required class="!mb-0">
                        </div>

                        <div>
                            <label class="text-sm font-semibold text-gray-700 mb-2 block">Senha</label>
                            <input type="password" name="senha" placeholder="minimo 6 caracteres" required class="!mb-0">
                        </div>

                        <div>
                            <label class="text-sm font-semibold text-gray-700 mb-2 block">Nivel de acesso</label>
                            <select name="role" required class="!mb-0">
                                <option th:each="r : ${roles}"
                                        th:value="${r}"
                                        th:text="${r.name() == 'ADMIN' ? 'Administrador' : 'Funcionario'}">
                                </option>
                            </select>
                            <p class="text-xs text-gray-400 mt-1.5">Administradores tem acesso completo. Funcionarios validam resgates.</p>
                        </div>
                    </div>

                    <button type="submit"
                            class="w-full mt-6 py-4 bg-primary hover:opacity-90 text-white rounded-xl font-bold text-base cursor-pointer border-0 transition-opacity">
                        Criar usuario
                    </button>
                </form>
            </div>
        </div>
    </main>
</div>

</body>
</html>
