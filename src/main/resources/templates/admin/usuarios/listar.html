<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Equipe')}"></head>
<body class="bg-gray-50 min-h-screen font-sans">

<div class="admin-layout">
    <th:block th:replace="~{fragments/nav-admin :: nav}"></th:block>

    <main class="admin-content">
        <div class="max-w-2xl mx-auto px-4 sm:px-6 py-6 animate-fade-in">

            <div class="flex items-center justify-between mb-6">
                <div>
                    <h1 class="text-2xl font-black text-gray-900">Equipe</h1>
                    <p class="text-sm text-gray-400 mt-0.5">Gerencie os usuarios da sua empresa</p>
                </div>
                <a href="/admin/usuarios/novo"
                   class="px-4 py-2.5 bg-primary hover:opacity-90 text-white rounded-xl text-sm font-bold transition-opacity">
                    + Novo
                </a>
            </div>

            <!-- Mensagem de erro -->
            <div th:if="${erro}"
                 class="bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl px-4 py-3 mb-4 animate-fade-in flex items-center gap-2">
                <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/>
                </svg>
                <span th:text="${erro}"></span>
            </div>

            <div class="bg-white rounded-2xl p-6 shadow-sm">
                <div class="space-y-3">
                    <div th:each="u : ${usuarios}"
                         class="flex items-center justify-between border border-gray-100 rounded-xl px-4 py-3.5 hover:border-gray-200 transition-colors stagger-item">

                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-full flex items-center justify-center font-bold text-sm flex-shrink-0"
                                 th:classappend="${u.role.name() == 'ADMIN'} ? 'bg-primary-50 text-primary' : 'bg-gray-100 text-gray-500'"
                                 th:text="${#strings.toUpperCase(#strings.substring(u.username, 0, 2))}">AB</div>
                            <div>
                                <p class="font-semibold text-gray-800 text-sm" th:text="${u.username}"></p>
                                <div class="flex items-center gap-2 mt-0.5">
                                    <span th:if="${u.role.name() == 'ADMIN'}"
                                          class="text-xs font-semibold text-primary bg-primary-50 px-2 py-0.5 rounded-full">
                                        Admin
                                    </span>
                                    <span th:if="${u.role.name() != 'ADMIN'}"
                                          class="text-xs font-semibold text-gray-500 bg-gray-100 px-2 py-0.5 rounded-full">
                                        Funcionario
                                    </span>
                                    <span th:if="${u.ativo}" class="text-xs text-green-600 font-medium flex items-center gap-0.5">
                                        <span class="w-1.5 h-1.5 rounded-full bg-green-500 inline-block"></span> Ativo
                                    </span>
                                    <span th:if="${!u.ativo}" class="text-xs text-gray-400 font-medium flex items-center gap-0.5">
                                        <span class="w-1.5 h-1.5 rounded-full bg-gray-300 inline-block"></span> Inativo
                                    </span>
                                </div>
                            </div>
                        </div>

                        <form th:action="@{'/admin/usuarios/' + ${u.id} + '/toggle'}" method="post" class="inline">
                            <button type="submit"
                                    class="px-3 py-1.5 font-medium cursor-pointer text-sm border-0 bg-transparent rounded-lg transition-colors"
                                    th:classappend="${u.ativo} ? 'text-gray-400 hover:bg-gray-100' : 'text-primary hover:bg-primary-50'">
                                <span th:if="${u.ativo}">Desativar</span>
                                <span th:if="${!u.ativo}">Ativar</span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

</body>
</html>
