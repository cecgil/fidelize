<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Usuários')}"></head>
<body class="bg-gray-50 min-h-screen">

<th:block th:replace="~{fragments/nav-admin :: nav}"></th:block>

<div class="max-w-lg mx-auto px-4 py-6">
    <div class="bg-white rounded-2xl p-6 shadow-sm">

        <div class="flex items-center justify-between mb-5">
            <h2 class="text-xl font-bold text-gray-900">Usuários</h2>
            <a href="/admin/usuarios/novo"
               class="px-4 py-2 bg-primary hover:opacity-90 text-white rounded-xl text-sm font-semibold">
                + Novo
            </a>
        </div>

        <div class="space-y-3">
            <div th:each="u : ${usuarios}"
                 class="flex items-center justify-between border border-gray-100 rounded-xl px-4 py-3">

                <div>
                    <p class="font-semibold text-gray-800 text-sm" th:text="${u.username}"></p>
                    <div class="flex items-center gap-2 mt-1">
                        <span th:if="${u.role.name() == 'ADMIN'}"
                              class="text-xs font-semibold bg-primary/10 text-primary px-2 py-0.5 rounded-full">
                            Admin
                        </span>
                        <span th:if="${u.role.name() != 'ADMIN'}"
                              class="text-xs font-semibold bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full">
                            Usuário
                        </span>
                        <span th:if="${u.ativo}" class="text-xs text-success font-semibold">● Ativo</span>
                        <span th:if="${!u.ativo}" class="text-xs text-gray-400 font-semibold">● Inativo</span>
                    </div>
                </div>

                <form th:action="@{'/admin/usuarios/' + ${u.id} + '/toggle'}" method="post" class="inline">
                    <button type="submit"
                            class="bg-transparent border-0 font-semibold cursor-pointer text-sm"
                            th:classappend="${u.ativo} ? 'text-gray-400 hover:text-gray-600' : 'text-primary hover:opacity-80'">
                        <span th:if="${u.ativo}">Desativar</span>
                        <span th:if="${!u.ativo}">Ativar</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
