<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Recompensas')}"></head>
<body class="bg-gray-50 min-h-screen">

<th:block th:replace="~{fragments/nav-admin :: nav}"></th:block>

<div class="max-w-lg mx-auto px-4 pt-6 pb-2">
    <p class="font-bold text-xs uppercase tracking-widest mb-1" style="color:#4f46e5">Programa de fidelidade</p>
    <h1 class="text-2xl font-black text-gray-900 mb-5">Recompensas</h1>
</div>

<div class="max-w-lg mx-auto px-4 pb-6">
    <div class="bg-white rounded-2xl p-6 shadow-sm">

        <div th:if="${erro}"
             class="bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl px-4 py-3 mb-4"
             th:text="${erro}">
        </div>

        <div class="flex items-center justify-between mb-5">
            <h2 class="text-lg font-black text-gray-900">Suas recompensas</h2>
            <a href="/admin/recompensas/nova"
               class="px-4 py-2 bg-primary hover:opacity-90 text-white rounded-xl text-sm font-semibold">
                + Nova
            </a>
        </div>

        <div th:if="${#lists.isEmpty(recompensas)}"
             class="text-center py-8 text-gray-400 text-sm">
            Nenhuma recompensa cadastrada ainda.<br>
            <a href="/admin/recompensas/nova" class="text-primary font-medium hover:underline mt-1 inline-block">
                Criar primeira recompensa
            </a>
        </div>

        <div th:if="${!#lists.isEmpty(recompensas)}" class="space-y-3">
            <div th:each="r : ${recompensas}"
                 class="flex items-center justify-between border border-gray-100 rounded-xl px-4 py-3">

                <div>
                    <p class="font-semibold text-gray-800 text-sm" th:text="${r.nome}"></p>
                    <span th:if="${r.ativa}"
                          class="text-xs font-semibold text-success">● Ativa</span>
                    <span th:if="${!r.ativa}"
                          class="text-xs font-semibold text-gray-400">● Inativa</span>
                </div>

                <div class="flex items-center gap-3 text-sm">
                    <a th:href="@{'/admin/recompensas/' + ${r.id} + '/editar'}"
                       class="text-primary font-medium hover:underline">
                        Editar
                    </a>

                    <form th:action="@{'/admin/recompensas/' + ${r.id} + '/toggle'}" method="post" class="inline">
                        <button type="submit"
                                class="bg-transparent border-0 font-semibold cursor-pointer text-sm"
                                th:classappend="${r.ativa} ? 'text-gray-400 hover:text-gray-600' : 'text-primary hover:opacity-80'">
                            <span th:if="${r.ativa}">Desativar</span>
                            <span th:if="${!r.ativa}">Ativar</span>
                        </button>
                    </form>

                    <button type="button"
                            class="bg-transparent border-0 text-red-400 hover:text-red-600 font-semibold cursor-pointer text-sm"
                            th:onclick="'openDeleteModal(\'' + ${r.id} + '\', \'' + ${r.nome} + '\')'">
                        Excluir
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal de confirmação de exclusão -->
<div id="deleteModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-2xl p-6 max-w-sm mx-4 shadow-xl">
        <h3 class="text-lg font-bold text-gray-900 mb-2">Excluir recompensa</h3>
        <p class="text-sm text-gray-600 mb-5">
            Tem certeza que deseja excluir <strong id="deleteModalNome"></strong>? Esta ação não pode ser desfeita.
        </p>
        <div class="flex gap-3 justify-end">
            <button onclick="closeDeleteModal()"
                    class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-sm font-semibold border-0 cursor-pointer">
                Cancelar
            </button>
            <form id="deleteForm" method="post" class="inline">
                <button type="submit"
                        class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-xl text-sm font-semibold border-0 cursor-pointer">
                    Excluir
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    function openDeleteModal(id, nome) {
        document.getElementById('deleteModalNome').textContent = nome;
        document.getElementById('deleteForm').action = '/admin/recompensas/' + id + '/delete';
        document.getElementById('deleteModal').classList.remove('hidden');
    }
    function closeDeleteModal() {
        document.getElementById('deleteModal').classList.add('hidden');
    }
    document.getElementById('deleteModal').addEventListener('click', function(e) {
        if (e.target === this) closeDeleteModal();
    });
</script>

</body>
</html>
