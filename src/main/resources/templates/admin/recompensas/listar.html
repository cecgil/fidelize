<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Recompensas')}"></head>
<body class="bg-gray-50 min-h-screen">

<th:block th:replace="~{fragments/nav-admin :: nav}"></th:block>

<div class="max-w-lg mx-auto px-4 py-6">
    <div class="bg-white rounded-2xl p-6 shadow-sm">

        <div class="flex items-center justify-between mb-5">
            <h2 class="text-xl font-bold text-gray-900">Recompensas</h2>
            <a href="/admin/recompensas/nova"
               class="px-4 py-2 bg-primary hover:opacity-90 text-white rounded-xl text-sm font-semibold">
                + Nova
            </a>
        </div>

        <div th:if="${#lists.isEmpty(recompensas)}"
             class="text-center py-8 text-gray-400 text-sm">
            Nenhuma recompensa cadastrada ainda.<br>
            <a href="/admin/recompensas/nova" class="text-primary font-medium hover:underline mt-1 inline-block">
                Criar primeira recompensa
            </a>
        </div>

        <div th:if="${!#lists.isEmpty(recompensas)}" class="space-y-3">
            <div th:each="r : ${recompensas}"
                 class="flex items-center justify-between border border-gray-100 rounded-xl px-4 py-3">

                <div>
                    <p class="font-semibold text-gray-800 text-sm" th:text="${r.nome}"></p>
                    <span th:if="${r.ativa}"
                          class="text-xs font-semibold text-success">● Ativa</span>
                    <span th:if="${!r.ativa}"
                          class="text-xs font-semibold text-gray-400">● Inativa</span>
                </div>

                <div class="flex items-center gap-3 text-sm">
                    <a th:href="@{'/admin/recompensas/' + ${r.id} + '/editar'}"
                       class="text-primary font-medium hover:underline">
                        Editar
                    </a>

                    <form th:action="@{'/admin/recompensas/' + ${r.id} + '/toggle'}" method="post" class="inline">
                        <button type="submit"
                                class="bg-transparent border-0 font-semibold cursor-pointer text-sm"
                                th:classappend="${r.ativa} ? 'text-gray-400 hover:text-gray-600' : 'text-primary hover:opacity-80'">
                            <span th:if="${r.ativa}">Desativar</span>
                            <span th:if="${!r.ativa}">Ativar</span>
                        </button>
                    </form>

                    <form th:action="@{'/admin/recompensas/' + ${r.id} + '/delete'}" method="post" class="inline"
                          onsubmit="return confirm('Deseja excluir esta recompensa?');">
                        <button type="submit"
                                class="bg-transparent border-0 text-red-400 hover:text-red-600 font-semibold cursor-pointer text-sm">
                            Excluir
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
