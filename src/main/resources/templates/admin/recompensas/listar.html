<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Recompensas')}"></head>
<body class="bg-gray-50 min-h-screen font-sans">

<div class="admin-layout">
    <th:block th:replace="~{fragments/nav-admin :: nav}"></th:block>

    <main class="admin-content">
        <div class="max-w-2xl mx-auto px-4 sm:px-6 py-6 animate-fade-in">

            <div class="flex items-center justify-between mb-6">
                <div>
                    <h1 class="text-2xl font-black text-gray-900">Recompensas</h1>
                    <p class="text-sm text-gray-400 mt-0.5">Gerencie os premios do seu programa</p>
                </div>
                <a href="/admin/recompensas/nova"
                   class="px-4 py-2.5 bg-primary hover:opacity-90 text-white rounded-xl text-sm font-bold transition-opacity">
                    + Nova
                </a>
            </div>

            <!-- Mensagem de erro -->
            <div th:if="${erro}"
                 class="bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl px-4 py-3 mb-4 animate-fade-in flex items-center gap-2">
                <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/>
                </svg>
                <span th:text="${erro}"></span>
            </div>

            <div class="bg-white rounded-2xl p-6 shadow-sm">
                <!-- Empty state -->
                <div th:if="${#lists.isEmpty(recompensas)}"
                     class="text-center py-10">
                    <div class="w-14 h-14 rounded-2xl bg-primary-50 flex items-center justify-center mx-auto mb-4">
                        <svg class="w-7 h-7 text-primary" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/>
                        </svg>
                    </div>
                    <p class="text-gray-500 font-medium text-sm mb-1">Nenhuma recompensa cadastrada</p>
                    <p class="text-gray-400 text-xs mb-4">Crie sua primeira recompensa para comecar</p>
                    <a href="/admin/recompensas/nova"
                       class="inline-block px-5 py-2.5 bg-primary text-white rounded-xl text-sm font-bold hover:opacity-90 transition-opacity">
                        Criar primeira recompensa
                    </a>
                </div>

                <!-- Lista -->
                <div th:if="${!#lists.isEmpty(recompensas)}" class="space-y-3">
                    <div th:each="r : ${recompensas}"
                         class="flex items-center justify-between border border-gray-100 rounded-xl px-4 py-3.5 hover:border-gray-200 transition-colors stagger-item">

                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0"
                                 th:classappend="${r.ativa} ? 'bg-green-50' : 'bg-gray-100'">
                                <svg th:if="${r.ativa}" class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/>
                                </svg>
                                <svg th:if="${!r.ativa}" class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/>
                                </svg>
                            </div>
                            <div>
                                <p class="font-semibold text-gray-800 text-sm" th:text="${r.nome}"></p>
                                <span th:if="${r.ativa}" class="text-xs font-semibold text-green-600">Ativa</span>
                                <span th:if="${!r.ativa}" class="text-xs font-semibold text-gray-400">Inativa</span>
                            </div>
                        </div>

                        <div class="flex items-center gap-2 text-sm">
                            <a th:href="@{'/admin/recompensas/' + ${r.id} + '/editar'}"
                               class="px-3 py-1.5 text-primary font-medium hover:bg-primary-50 rounded-lg transition-colors">
                                Editar
                            </a>

                            <form th:action="@{'/admin/recompensas/' + ${r.id} + '/toggle'}" method="post" class="inline">
                                <button type="submit"
                                        class="px-3 py-1.5 font-medium cursor-pointer text-sm border-0 bg-transparent rounded-lg transition-colors"
                                        th:classappend="${r.ativa} ? 'text-gray-400 hover:bg-gray-100' : 'text-primary hover:bg-primary-50'">
                                    <span th:if="${r.ativa}">Desativar</span>
                                    <span th:if="${!r.ativa}">Ativar</span>
                                </button>
                            </form>

                            <button type="button"
                                    class="px-3 py-1.5 text-red-400 hover:bg-red-50 font-medium cursor-pointer text-sm border-0 bg-transparent rounded-lg transition-colors btn-delete"
                                    th:data-id="${r.id}"
                                    th:data-nome="${r.nome}">
                                Excluir
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Modal de confirmacao de exclusao -->
<div id="deleteModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 hidden" style="animation: fadeIn 0.2s ease">
    <div class="bg-white rounded-2xl p-6 max-w-sm mx-4 shadow-xl animate-fade-in-up">
        <div class="w-12 h-12 rounded-xl bg-red-50 flex items-center justify-center mx-auto mb-4">
            <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
            </svg>
        </div>
        <h3 class="text-lg font-bold text-gray-900 text-center mb-1">Excluir recompensa</h3>
        <p class="text-sm text-gray-500 text-center mb-5">
            Tem certeza que deseja excluir <strong id="deleteModalNome" class="text-gray-700"></strong>? Esta acao nao pode ser desfeita.
        </p>
        <div class="flex gap-3">
            <button onclick="closeDeleteModal()"
                    class="flex-1 px-4 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-sm font-semibold border-0 cursor-pointer transition-colors">
                Cancelar
            </button>
            <form id="deleteForm" method="post" class="flex-1">
                <button type="submit"
                        class="w-full px-4 py-3 bg-red-500 hover:bg-red-600 text-white rounded-xl text-sm font-semibold border-0 cursor-pointer transition-colors">
                    Excluir
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    document.querySelectorAll('.btn-delete').forEach(function(btn) {
        btn.addEventListener('click', function() {
            document.getElementById('deleteModalNome').textContent = this.dataset.nome;
            document.getElementById('deleteForm').action = '/admin/recompensas/' + this.dataset.id + '/delete';
            document.getElementById('deleteModal').classList.remove('hidden');
        });
    });
    function closeDeleteModal() {
        document.getElementById('deleteModal').classList.add('hidden');
    }
    document.getElementById('deleteModal').addEventListener('click', function(e) {
        if (e.target === this) closeDeleteModal();
    });
</script>

</body>
</html>
