<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Recompensa')}"></head>
<body class="bg-gray-50 min-h-screen font-sans">

<div class="admin-layout">
    <th:block th:replace="~{fragments/nav-admin :: nav}"></th:block>

    <main class="admin-content">
        <div class="max-w-2xl mx-auto px-4 sm:px-6 py-6 animate-fade-in">

            <div class="mb-6">
                <a href="/admin/recompensas" class="text-sm text-gray-400 hover:text-gray-600 font-medium inline-flex items-center gap-1 mb-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
                    </svg>
                    Voltar
                </a>
                <h1 class="text-2xl font-black text-gray-900"
                    th:text="${recompensa.id == null ? 'Nova recompensa' : 'Editar recompensa'}"></h1>
            </div>

            <div class="bg-white rounded-2xl p-6 shadow-sm">
                <!-- Criar -->
                <form th:if="${recompensa.id == null}" th:action="@{/admin/recompensas}" method="post">
                    <label class="text-sm font-semibold text-gray-700 mb-2 block">Nome da recompensa</label>
                    <input type="text" name="nome" required placeholder="Ex: Corte gratis" class="!mb-1">
                    <p class="text-xs text-gray-400 mb-5">O nome que o cliente vera ao completar o ciclo de visitas</p>
                    <button type="submit"
                            class="w-full py-4 bg-primary hover:opacity-90 text-white rounded-xl font-bold text-base cursor-pointer border-0 transition-opacity">
                        Criar recompensa
                    </button>
                </form>

                <!-- Editar -->
                <form th:if="${recompensa.id != null}"
                      th:action="@{'/admin/recompensas/' + ${recompensa.id} + '/editar'}" method="post">
                    <label class="text-sm font-semibold text-gray-700 mb-2 block">Nome da recompensa</label>
                    <input type="text" name="nome" required th:value="${recompensa.nome}" class="!mb-1">
                    <p class="text-xs text-gray-400 mb-5">O nome que o cliente vera ao completar o ciclo de visitas</p>
                    <button type="submit"
                            class="w-full py-4 bg-primary hover:opacity-90 text-white rounded-xl font-bold text-base cursor-pointer border-0 transition-opacity">
                        Salvar alteracoes
                    </button>
                </form>
            </div>
        </div>
    </main>
</div>

</body>
</html>
