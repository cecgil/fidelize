<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Recompensa')}"></head>
<body class="bg-gray-50 min-h-screen">

<th:block th:replace="~{fragments/nav-admin :: nav}"></th:block>

<div class="max-w-lg mx-auto px-4 py-6">
    <div class="bg-white rounded-2xl p-6 shadow-sm">

        <h2 class="text-xl font-bold text-gray-900 mb-5"
            th:text="${recompensa.id == null ? 'Nova recompensa' : 'Editar recompensa'}"></h2>

        <!-- Criar -->
        <form th:if="${recompensa.id == null}" th:action="@{/admin/recompensas}" method="post">
            <label>Nome da recompensa</label>
            <input type="text" name="nome" required placeholder="Ex: Corte grátis">
            <button type="submit"
                    class="w-full py-4 bg-primary hover:opacity-90 text-white rounded-xl font-bold text-base cursor-pointer border-0">
                Salvar
            </button>
        </form>

        <!-- Editar -->
        <form th:if="${recompensa.id != null}"
              th:action="@{'/admin/recompensas/' + ${recompensa.id} + '/editar'}" method="post">
            <label>Nome da recompensa</label>
            <input type="text" name="nome" required th:value="${recompensa.nome}">
            <button type="submit"
                    class="w-full py-4 bg-primary hover:opacity-90 text-white rounded-xl font-bold text-base cursor-pointer border-0">
                Atualizar
            </button>
        </form>

        <a href="/admin/recompensas"
           class="block text-center text-sm text-gray-400 hover:text-gray-600 mt-4">
            ← Voltar
        </a>
    </div>
</div>

</body>
</html>
