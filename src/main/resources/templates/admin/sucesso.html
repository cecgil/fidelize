<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Resgate confirmado')}"></head>
<body class="bg-gray-50 min-h-screen font-sans">

<div class="admin-layout">
    <th:block th:replace="~{fragments/nav-admin :: nav}"></th:block>

    <main class="admin-content">
        <div class="max-w-lg mx-auto px-4 sm:px-6 py-6 animate-fade-in">

            <div class="bg-white rounded-2xl p-6 shadow-sm text-center">
                <div class="w-16 h-16 rounded-2xl bg-green-50 flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-green-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
                <h2 class="text-xl font-black text-green-600 mb-5">Resgate confirmado!</h2>

                <div class="bg-green-50 border border-green-100 rounded-xl p-4 mb-6 space-y-3 text-left">
                    <div class="flex justify-between items-center">
                        <span class="text-sm text-gray-500">Cliente</span>
                        <span class="font-semibold text-gray-800" th:text="${cliente}"></span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-sm text-gray-500">Recompensa</span>
                        <span class="font-semibold text-green-600" th:text="${recompensa}"></span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-sm text-gray-500">Data</span>
                        <span class="text-sm text-gray-600 tabular-nums"
                              th:text="${#temporals.format(data, 'dd/MM/yyyy HH:mm')}"></span>
                    </div>
                </div>

                <a href="/admin/painel"
                   class="block py-4 bg-primary hover:opacity-90 text-white rounded-xl font-bold text-sm text-center transition-opacity">
                    Voltar ao painel
                </a>
            </div>
        </div>
    </main>
</div>

</body>
</html>
