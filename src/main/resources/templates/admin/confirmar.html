<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Confirmar resgate')}"></head>
<body class="bg-gray-50 min-h-screen">

<th:block th:replace="~{fragments/nav-admin :: nav}"></th:block>

<!-- Header de impacto -->
<div class="px-4 pt-8 pb-10 text-center" style="background: linear-gradient(160deg, #16a34a 0%, #15803d 100%)">
    <div class="w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-3"
         style="background: rgba(255,255,255,0.2)">
        <span class="text-3xl">🎁</span>
    </div>
    <p class="font-bold text-xs uppercase tracking-widest mb-1 text-green-200">Resgate de recompensa</p>
    <h1 class="text-2xl font-black text-white">Confirmar resgate</h1>
    <p class="text-green-200 text-sm mt-1">Verifique os dados antes de confirmar</p>
</div>

<div class="max-w-lg mx-auto px-4 -mt-4 pb-6">
    <div class="bg-white rounded-2xl p-6 shadow-sm">

        <p class="font-bold text-xs uppercase tracking-widest mb-4" style="color:#4f46e5">Detalhes do resgate</p>

        <div class="bg-green-50 border border-green-100 rounded-xl p-4 mb-6 space-y-3">
            <div class="flex justify-between items-center">
                <span class="text-sm text-gray-500">Cliente</span>
                <span class="font-bold text-gray-800" th:text="${resgate.cliente.nome}"></span>
            </div>
            <div class="border-t border-green-100"></div>
            <div class="flex justify-between items-center">
                <span class="text-sm text-gray-500">Recompensa</span>
                <span class="font-bold text-base" style="color:#16a34a" th:text="${resgate.recompensa.nome}"></span>
            </div>
        </div>

        <form th:action="@{'/validar/' + ${token} + '/confirmar'}" method="post">
            <button type="submit"
                    class="w-full py-4 text-white rounded-xl font-bold text-base cursor-pointer border-0 hover:opacity-90"
                    style="background:#16a34a">
                ✓ Confirmar e entregar recompensa
            </button>
        </form>

        <a href="/admin/painel"
           class="block text-center text-sm text-gray-400 hover:text-gray-600 mt-3">
            Cancelar
        </a>
    </div>
</div>

</body>
</html>
