<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Confirmar resgate')}"></head>
<body class="bg-gray-50 min-h-screen">

<th:block th:replace="~{fragments/nav-admin :: nav}"></th:block>

<div class="max-w-lg mx-auto px-4 py-6">
    <div class="bg-white rounded-2xl p-6 shadow-sm">

        <h2 class="text-xl font-bold text-gray-900 mb-5">Confirmar resgate</h2>

        <div class="bg-gray-50 rounded-xl p-4 mb-6 space-y-3">
            <div class="flex justify-between items-center">
                <span class="text-sm text-gray-500">Cliente</span>
                <span class="font-semibold text-gray-800" th:text="${resgate.cliente.nome}"></span>
            </div>
            <div class="flex justify-between items-center">
                <span class="text-sm text-gray-500">Recompensa</span>
                <span class="font-semibold text-success" th:text="${resgate.recompensa.nome}"></span>
            </div>
        </div>

        <form th:action="@{'/validar/' + ${token} + '/confirmar'}" method="post">
            <button type="submit"
                    class="w-full py-4 bg-success hover:opacity-90 text-white rounded-xl font-bold text-base cursor-pointer border-0">
                ✓ Confirmar uso
            </button>
        </form>
    </div>
</div>

</body>
</html>
