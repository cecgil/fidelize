<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Confirmar resgate')}"></head>
<body class="bg-gray-50 min-h-screen font-sans">

<div class="admin-layout">
    <th:block th:replace="~{fragments/nav-admin :: nav}"></th:block>

    <main class="admin-content">
        <div class="max-w-lg mx-auto px-4 sm:px-6 py-6 animate-fade-in">

            <!-- Header de impacto -->
            <div class="rounded-2xl p-6 text-center mb-5" style="background: linear-gradient(160deg, #16a34a 0%, #15803d 100%)">
                <div class="w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-3"
                     style="background: rgba(255,255,255,0.2)">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/>
                    </svg>
                </div>
                <h1 class="text-xl font-black text-white">Confirmar resgate</h1>
                <p class="text-green-200 text-sm mt-1">Verifique os dados antes de confirmar</p>
            </div>

            <div class="bg-white rounded-2xl p-6 shadow-sm">
                <div class="bg-green-50 border border-green-100 rounded-xl p-5 mb-6 space-y-4">
                    <div class="flex justify-between items-center">
                        <span class="text-sm text-gray-500">Cliente</span>
                        <span class="font-bold text-gray-800" th:text="${resgate.cliente.nome}"></span>
                    </div>
                    <div class="border-t border-green-100"></div>
                    <div class="flex justify-between items-center">
                        <span class="text-sm text-gray-500">Recompensa</span>
                        <span class="font-bold text-green-600" th:text="${resgate.recompensa.nome}"></span>
                    </div>
                </div>

                <form th:action="@{'/validar/' + ${token} + '/confirmar'}" method="post">
                    <button type="submit"
                            class="w-full py-4 text-white rounded-xl font-bold text-base cursor-pointer border-0 hover:opacity-90 transition-opacity"
                            style="background:#16a34a">
                        Confirmar e entregar recompensa
                    </button>
                </form>

                <a href="/admin/painel"
                   class="block text-center text-sm text-gray-400 hover:text-gray-600 mt-3 font-medium">
                    Cancelar
                </a>
            </div>
        </div>
    </main>
</div>

</body>
</html>
