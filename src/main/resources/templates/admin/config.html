<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Configurações')}"></head>
<body class="bg-gray-50 min-h-screen">

<th:block th:replace="~{fragments/nav-admin :: nav}"></th:block>

<div class="max-w-lg mx-auto px-4 pt-6 pb-2">
    <p class="font-bold text-xs uppercase tracking-widest mb-1" style="color:#4f46e5">Programa de fidelidade</p>
    <h1 class="text-2xl font-black text-gray-900">Configurações</h1>
    <p class="text-sm text-gray-400 mt-1 mb-5">Ajuste as regras do seu programa de fidelidade</p>
</div>

<div class="max-w-lg mx-auto px-4 pb-6">
    <div class="bg-white rounded-2xl p-6 shadow-sm">

        <form method="post" th:action="@{/admin/config}" th:object="${empresa}">

            <p class="font-bold text-xs uppercase tracking-widest mb-4" style="color:#4f46e5">Regras do programa</p>

            <label>Visitas para resgatar recompensa</label>
            <input type="number" th:field="*{visitasParaRecompensa}" min="1" required>

            <label>Intervalo mínimo entre visitas (horas)</label>
            <input type="number" th:field="*{intervaloMinimoHoras}" min="1" required>

            <div class="flex items-center justify-between bg-gray-50 rounded-xl px-4 py-4 mb-4">
                <div>
                    <p class="font-semibold text-gray-800 text-sm">Fidelidade ativa</p>
                    <p class="text-gray-400 text-xs mt-0.5">Desative para pausar o programa</p>
                </div>
                <input type="checkbox" th:field="*{fidelidadeAtiva}"
                       class="w-5 h-5 accent-primary cursor-pointer" style="width:20px; height:20px; margin-bottom:0;">
            </div>

            <button type="submit"
                    class="w-full py-4 bg-primary hover:opacity-90 text-white rounded-xl font-bold text-base cursor-pointer border-0">
                Salvar configurações
            </button>
        </form>
    </div>
</div>

</body>
</html>
