<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Configuracoes')}"></head>
<body class="bg-gray-50 min-h-screen font-sans">

<div class="admin-layout">
    <th:block th:replace="~{fragments/nav-admin :: nav}"></th:block>

    <main class="admin-content">
        <div class="max-w-2xl mx-auto px-4 sm:px-6 py-6 animate-fade-in">

            <div class="mb-6">
                <h1 class="text-2xl font-black text-gray-900">Configuracoes</h1>
                <p class="text-sm text-gray-400 mt-0.5">Ajuste as regras do seu programa de fidelidade</p>
            </div>

            <div class="bg-white rounded-2xl p-6 shadow-sm">
                <form method="post" th:action="@{/admin/config}" th:object="${empresa}">

                    <div class="space-y-5">
                        <div>
                            <label class="text-sm font-semibold text-gray-700 mb-2 block">Visitas para resgatar recompensa</label>
                            <input type="number" th:field="*{visitasParaRecompensa}" min="1" required
                                   class="!mb-0">
                            <p class="text-xs text-gray-400 mt-1.5">Quantas visitas o cliente precisa acumular para ganhar uma recompensa</p>
                        </div>

                        <div>
                            <label class="text-sm font-semibold text-gray-700 mb-2 block">Intervalo minimo entre visitas (horas)</label>
                            <input type="number" th:field="*{intervaloMinimoHoras}" min="1" required
                                   class="!mb-0">
                            <p class="text-xs text-gray-400 mt-1.5">Protecao anti-abuso: impede registro de multiplas visitas no mesmo dia</p>
                        </div>

                        <div class="flex items-center justify-between bg-gray-50 rounded-xl px-5 py-4">
                            <div>
                                <p class="font-semibold text-gray-800 text-sm">Fidelidade ativa</p>
                                <p class="text-gray-400 text-xs mt-0.5">Desative para pausar o programa temporariamente</p>
                            </div>
                            <input type="checkbox" th:field="*{fidelidadeAtiva}"
                                   class="w-5 h-5 accent-primary cursor-pointer rounded" style="width:20px; height:20px; margin-bottom:0;">
                        </div>
                    </div>

                    <button type="submit"
                            class="w-full mt-6 py-4 bg-primary hover:opacity-90 text-white rounded-xl font-bold text-base cursor-pointer border-0 transition-opacity">
                        Salvar configuracoes
                    </button>
                </form>
            </div>
        </div>
    </main>
</div>

</body>
</html>
