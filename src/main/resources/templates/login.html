<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Login')}"></head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4">

<div class="w-full max-w-sm">

    <!-- Marca -->
    <div class="text-center mb-8">
        <div class="w-14 h-14 bg-primary rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg">
            <span class="text-white font-bold text-2xl">F</span>
        </div>
        <p class="text-gray-900 font-bold text-xl">Fidelize</p>
        <p class="text-gray-400 text-sm mt-1">Acesse sua conta</p>
    </div>

    <div class="bg-white rounded-2xl p-6 shadow-sm">

        <div th:if="${param.error}"
             class="flex items-start gap-2 bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl px-4 py-3 mb-4">
            <span class="flex-shrink-0 mt-0.5">⚠️</span>
            <span>Usuário ou senha incorretos. Tente novamente.</span>
        </div>

        <form th:action="@{/login}" method="post">
            <label>Usuário</label>
            <input type="text" name="username" placeholder="seu usuário" required autofocus autocomplete="username">

            <label>Senha</label>
            <div class="relative">
                <input type="password" name="password" id="senhaLogin"
                       placeholder="••••••••" required autocomplete="current-password"
                       style="margin-bottom: 0; padding-right: 70px;">
                <button type="button"
                        onclick="var i=document.getElementById('senhaLogin'); i.type=i.type==='password'?'text':'password'; this.textContent=i.type==='password'?'ver':'ocultar';"
                        class="absolute right-3 top-3 text-xs text-gray-400 hover:text-primary font-semibold border-0 bg-transparent cursor-pointer py-1 px-2">
                    ver
                </button>
            </div>
            <div class="mb-4"></div>

            <button type="submit"
                    class="w-full py-4 bg-primary hover:opacity-90 text-white rounded-xl font-bold text-base cursor-pointer border-0">
                Entrar
            </button>
        </form>
    </div>

    <p class="text-center text-sm text-gray-400 mt-5">
        Não tem conta?
        <a href="/cadastro" class="text-primary font-semibold hover:underline">Criar conta grátis</a>
    </p>
</div>

</body>
</html>
