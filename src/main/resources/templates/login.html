<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Login')}"></head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4">

<div class="w-full max-w-sm">
    <div class="text-center mb-8">
        <p class="text-primary font-bold text-2xl">Fidelize</p>
        <p class="text-gray-400 text-sm mt-1">Acesse sua conta</p>
    </div>

    <div class="bg-white rounded-2xl p-6 shadow-sm">

        <div th:if="${param.error}"
             class="bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl px-4 py-3 mb-4">
            Usuário ou senha incorretos.
        </div>

        <form th:action="@{/login}" method="post">
            <label>Usuário</label>
            <input type="text" name="username" placeholder="seu usuário" required autofocus>

            <label>Senha</label>
            <input type="password" name="password" placeholder="••••••••" required>

            <button type="submit"
                    class="w-full py-4 bg-primary hover:opacity-90 text-white rounded-xl font-bold text-base cursor-pointer border-0 mt-2">
                Entrar
            </button>
        </form>
    </div>

    <p class="text-center text-sm text-gray-400 mt-4">
        Não tem conta?
        <a href="/cadastro" class="text-primary font-medium hover:underline">Criar conta grátis</a>
    </p>
</div>

</body>
</html>
