<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Login')}"></head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4 font-sans">

<div class="w-full max-w-sm animate-fade-in">

    <!-- Marca -->
    <div class="text-center mb-8">
        <div class="w-14 h-14 bg-primary rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg shadow-primary/20">
            <span class="text-white font-black text-2xl">F</span>
        </div>
        <p class="text-gray-900 font-black text-xl tracking-tight">Fidelize</p>
        <p class="text-gray-400 text-sm mt-1">Acesse sua conta</p>
    </div>

    <div class="bg-white rounded-2xl p-6 shadow-sm">

        <div th:if="${param.error}"
             class="flex items-start gap-2 bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl px-4 py-3 mb-4">
            <svg class="w-4 h-4 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/>
            </svg>
            <span>Usuario ou senha incorretos. Tente novamente.</span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="space-y-4">
                <div>
                    <label class="text-sm font-semibold text-gray-700 mb-1.5 block">Usuario</label>
                    <input type="text" name="username" placeholder="seu usuario" required autofocus autocomplete="username"
                           class="!mb-0" aria-label="Usuario">
                </div>

                <div>
                    <label class="text-sm font-semibold text-gray-700 mb-1.5 block">Senha</label>
                    <div class="relative">
                        <input type="password" name="password" id="senhaLogin"
                               placeholder="sua senha" required autocomplete="current-password"
                               class="!mb-0 !pr-16" aria-label="Senha">
                        <button type="button"
                                onclick="var i=document.getElementById('senhaLogin'); i.type=i.type==='password'?'text':'password'; this.textContent=i.type==='password'?'ver':'ocultar';"
                                class="absolute right-3 top-3 text-xs text-gray-400 hover:text-primary font-semibold border-0 bg-transparent cursor-pointer py-1 px-2 transition-colors">
                            ver
                        </button>
                    </div>
                </div>
            </div>

            <button type="submit"
                    class="w-full mt-6 py-4 bg-primary hover:opacity-90 text-white rounded-xl font-bold text-base cursor-pointer border-0 transition-opacity">
                Entrar
            </button>
        </form>
    </div>

    <p class="text-center text-sm text-gray-400 mt-5">
        Nao tem conta?
        <a href="/cadastro" class="text-primary font-semibold hover:underline">Criar conta gratis</a>
    </p>
</div>

</body>
</html>
