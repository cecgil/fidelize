<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Registrar visita')}"></head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4">

<div class="w-full max-w-sm">
    <div class="bg-white rounded-2xl p-6 shadow-sm">

        <!-- Cabeçalho da empresa -->
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-primary/10 rounded-2xl flex items-center justify-center mx-auto mb-3">
                <span class="text-3xl"
                      th:text="${empresa.segmento.name() == 'BARBEARIA' ? '✂️' :
                                 empresa.segmento.name() == 'OFICINA'   ? '🚗' : '🍽️'}">🏪</span>
            </div>
            <p class="font-black text-xl text-gray-900" th:text="${empresa.nome}">Empresa</p>
            <p class="text-xs text-gray-400 mt-0.5"
               th:text="${empresa.segmento.name() == 'BARBEARIA' ? 'Barbearia' :
                          empresa.segmento.name() == 'OFICINA'   ? 'Oficina mecânica' : 'Restaurante'}">
            </p>
        </div>

        <!-- Motivação: programa de fidelidade -->
        <div class="bg-indigo-50 rounded-xl px-4 py-3 mb-5 text-center">
            <p class="font-bold text-xs uppercase tracking-widest mb-1" style="color:#4f46e5">Programa de fidelidade</p>
            <p class="text-sm text-gray-700">
                Acumule <strong style="color:#4f46e5" th:text="${empresa.visitasParaRecompensa}">10</strong> visitas e ganhe uma recompensa!
            </p>
        </div>

        <div th:if="${erro}"
             class="bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl px-4 py-3 mb-4"
             th:text="${erro}">
        </div>

        <form method="post" th:action="@{/c/{id}/solicitar(id=${empresa.id})}">
            <label>Nome</label>
            <input type="text" name="nome" id="nome" placeholder="Seu nome completo" required autocomplete="name">

            <label>Telefone</label>
            <input type="tel" name="telefone" id="telefone" placeholder="(11) 99999-9999" required autocomplete="tel">

            <label>E-mail</label>
            <input type="email" name="email" id="email" placeholder="seu@email.com" required autocomplete="email">

            <button type="submit"
                    class="w-full py-4 bg-primary hover:opacity-90 text-white rounded-xl font-bold text-base cursor-pointer border-0">
                Enviar código de verificação
            </button>
        </form>

        <p class="text-xs text-gray-300 text-center mt-4">
            Enviaremos um código para seu e-mail
        </p>
    </div>
</div>

<script>
    const tel = document.getElementById('telefone');
    tel.addEventListener('input', function () {
        let v = this.value.replace(/\D/g, '').slice(0, 11);
        if (v.length > 10) {
            v = '(' + v.slice(0,2) + ') ' + v.slice(2,7) + '-' + v.slice(7);
        } else if (v.length > 6) {
            v = '(' + v.slice(0,2) + ') ' + v.slice(2,6) + '-' + v.slice(6);
        } else if (v.length > 2) {
            v = '(' + v.slice(0,2) + ') ' + v.slice(2);
        }
        this.value = v;
    });
</script>

</body>
</html>
