<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Registrar visita')}"></head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4 py-6 font-sans">

<div class="w-full max-w-sm animate-fade-in">
    <div class="bg-white rounded-2xl p-6 shadow-sm">

        <!-- Cabecalho da empresa -->
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-primary-50 rounded-2xl flex items-center justify-center mx-auto mb-3">
                <span class="text-3xl"
                      th:text="${empresa.segmento.name() == 'BARBEARIA' ? '&#9986;' :
                                 empresa.segmento.name() == 'OFICINA'   ? '&#128663;' : '&#127869;'}"></span>
            </div>
            <p class="font-black text-xl text-gray-900" th:text="${empresa.nome}">Empresa</p>
            <p class="text-xs text-gray-400 mt-0.5"
               th:text="${empresa.segmento.name() == 'BARBEARIA' ? 'Barbearia' :
                          empresa.segmento.name() == 'OFICINA'   ? 'Oficina mecanica' : 'Restaurante'}">
            </p>
        </div>

        <!-- Motivacao: programa de fidelidade -->
        <div class="bg-primary-50 rounded-xl px-4 py-3 mb-5 text-center">
            <p class="font-bold text-xs uppercase tracking-widest mb-1 text-primary">Programa de fidelidade</p>
            <p class="text-sm text-gray-700">
                Acumule <strong class="text-primary" th:text="${empresa.visitasParaRecompensa}">10</strong> visitas e ganhe uma recompensa!
            </p>
        </div>

        <!-- Indicador de etapas -->
        <div class="flex items-center justify-center gap-2 mb-5">
            <div class="flex items-center gap-1.5">
                <div class="w-6 h-6 rounded-full bg-primary text-white text-xs font-bold flex items-center justify-center">1</div>
                <span class="text-xs font-semibold text-primary">Dados</span>
            </div>
            <div class="w-8 h-0.5 bg-gray-200 rounded"></div>
            <div class="flex items-center gap-1.5">
                <div class="w-6 h-6 rounded-full bg-gray-200 text-gray-400 text-xs font-bold flex items-center justify-center">2</div>
                <span class="text-xs font-medium text-gray-400">Verificar</span>
            </div>
        </div>

        <div th:if="${erro}"
             class="bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl px-4 py-3 mb-4 flex items-center gap-2"
             th:text="${erro}">
        </div>

        <form method="post" th:action="@{/c/{id}/solicitar(id=${empresa.id})}" id="registroForm">
            <div class="space-y-4">
                <div>
                    <label class="text-sm font-semibold text-gray-700 mb-1.5 block">Nome</label>
                    <div class="relative">
                        <svg class="w-4 h-4 text-gray-400 absolute left-3.5 top-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                        <input type="text" name="nome" id="nome" placeholder="Seu nome completo" required autocomplete="name"
                               th:value="${nome}" class="!pl-10 !mb-0" aria-label="Nome completo">
                    </div>
                </div>

                <div>
                    <label class="text-sm font-semibold text-gray-700 mb-1.5 block">Telefone</label>
                    <div class="relative">
                        <svg class="w-4 h-4 text-gray-400 absolute left-3.5 top-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                        </svg>
                        <input type="tel" name="telefone" id="telefone" placeholder="(11) 99999-9999" required autocomplete="tel"
                               th:value="${telefone}" class="!pl-10 !mb-0" aria-label="Telefone">
                    </div>
                </div>

                <div>
                    <label class="text-sm font-semibold text-gray-700 mb-1.5 block">E-mail</label>
                    <div class="relative">
                        <svg class="w-4 h-4 text-gray-400 absolute left-3.5 top-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                        </svg>
                        <input type="email" name="email" id="email" placeholder="seu@email.com" required autocomplete="email"
                               th:value="${email}" class="!pl-10 !mb-0" aria-label="E-mail">
                    </div>
                </div>
            </div>

            <button type="submit" id="submitBtn"
                    class="w-full mt-6 py-4 bg-primary hover:opacity-90 text-white rounded-xl font-bold text-base cursor-pointer border-0 transition-opacity">
                Enviar codigo de verificacao
            </button>
        </form>

        <p class="text-xs text-gray-300 text-center mt-4">
            Enviaremos um codigo para seu e-mail
        </p>
    </div>
</div>

<script>
    // Phone mask
    const tel = document.getElementById('telefone');
    tel.addEventListener('input', function () {
        let v = this.value.replace(/\D/g, '').slice(0, 11);
        if (v.length > 10) {
            v = '(' + v.slice(0,2) + ') ' + v.slice(2,7) + '-' + v.slice(7);
        } else if (v.length > 6) {
            v = '(' + v.slice(0,2) + ') ' + v.slice(2,6) + '-' + v.slice(6);
        } else if (v.length > 2) {
            v = '(' + v.slice(0,2) + ') ' + v.slice(2);
        }
        this.value = v;
    });

    // Loading state on submit
    document.getElementById('registroForm').addEventListener('submit', function() {
        var btn = document.getElementById('submitBtn');
        btn.classList.add('btn-loading');
        btn.disabled = true;
    });
</script>

</body>
</html>
