<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Registrar visita')}"></head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4">

<div class="w-full max-w-sm">
    <div class="bg-white rounded-2xl p-6 shadow-sm">

        <div class="text-center mb-6">
            <p class="text-primary font-bold text-xl" th:text="${empresa.nome}">Empresa</p>
            <p class="text-gray-400 text-sm mt-1">Registre sua visita e acumule benefícios</p>
        </div>

        <div th:if="${erro}"
             class="bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl px-4 py-3 mb-4"
             th:text="${erro}">
        </div>

        <form method="post">
            <label>Nome</label>
            <input type="text" name="nome" placeholder="Seu nome" required>

            <label>Telefone</label>
            <input type="tel" name="telefone" placeholder="(11) 99999-9999" required>

            <button type="submit"
                    class="w-full py-4 bg-primary hover:opacity-90 text-white rounded-xl font-bold text-base cursor-pointer border-0">
                Registrar visita
            </button>
        </form>
    </div>
</div>

</body>
</html>
