<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Visita registrada')}"></head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4">

<div class="w-full max-w-sm">
    <div class="bg-white rounded-2xl p-6 shadow-sm text-center">

        <!-- Aviso: visita duplicada -->
        <div th:if="${aviso != null}">
            <p class="text-4xl mb-3">👋</p>
            <h2 class="text-xl font-bold text-gray-900 mb-1">
                Olá, <span th:text="${cliente.nome}"></span>!
            </h2>
            <p class="text-sm text-amber-600 bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 mt-3 mb-4"
               th:text="${aviso}"></p>
        </div>

        <!-- Sucesso: visita nova -->
        <div th:if="${aviso == null}">
            <p class="text-4xl mb-3">🎉</p>
            <h2 class="text-xl font-bold text-gray-900 mb-1">Visita registrada!</h2>
            <p class="text-gray-500 text-sm mb-4" th:text="'Obrigado, ' + ${cliente.nome} + '!'"></p>
        </div>

        <!-- Progresso -->
        <div class="progress">
            <div class="progress-bar"
                 th:style="'width:' + (${totalVisitas} * 100 / ${empresa.visitasParaRecompensa}) + '%'">
            </div>
        </div>
        <p class="text-sm text-gray-500 mb-4"
           th:text="${totalVisitas} + ' / ' + ${empresa.visitasParaRecompensa} + ' visitas'"></p>

        <!-- Pode resgatar -->
        <div th:if="${podeResgatar}" class="mb-4">
            <p class="text-success font-semibold text-sm mb-3">🎁 Você atingiu o número de visitas!</p>
            <form th:if="${recompensa != null}"
                  th:action="@{'/resgate/' + ${cliente.id} + '/' + ${recompensa.id}}"
                  method="post">
                <button type="submit"
                        class="w-full py-4 bg-success hover:opacity-90 text-white rounded-xl font-bold text-base cursor-pointer border-0"
                        th:text="'Resgatar: ' + ${recompensa.nome}">
                    Resgatar
                </button>
            </form>
        </div>

        <!-- Faltam visitas -->
        <p th:if="${!podeResgatar}" class="text-sm text-gray-400 mb-4">
            Faltam <strong class="text-gray-700" th:text="${empresa.visitasParaRecompensa - totalVisitas}"></strong>
            visita(s) para sua recompensa
        </p>

        <a th:href="@{'/c/' + ${empresa.id}}"
           class="text-sm text-primary hover:underline">
            Registrar outra visita
        </a>
    </div>
</div>

</body>
</html>
