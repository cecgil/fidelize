<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Visita registrada')}"></head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4 py-6 font-sans">

<div class="w-full max-w-sm animate-fade-in">
    <div class="bg-white rounded-2xl p-6 shadow-sm text-center">

        <!-- Aviso: visita duplicada -->
        <div th:if="${aviso != null}">
            <div class="w-14 h-14 rounded-2xl bg-amber-50 flex items-center justify-center mx-auto mb-3">
                <svg class="w-7 h-7 text-amber-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
            </div>
            <h2 class="text-xl font-bold text-gray-900 mb-1">
                Ola, <span th:text="${cliente.nome}"></span>!
            </h2>
            <p class="text-sm text-amber-600 bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 mt-3 mb-5"
               th:text="${aviso}"></p>
        </div>

        <!-- Sucesso: visita nova -->
        <div th:if="${aviso == null}" id="successHeader">
            <div class="w-14 h-14 rounded-2xl bg-green-50 flex items-center justify-center mx-auto mb-3">
                <svg class="w-7 h-7 text-green-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
            </div>
            <h2 class="text-xl font-bold text-gray-900 mb-1">Visita registrada!</h2>
            <p class="text-gray-500 text-sm mb-5" th:text="'Obrigado, ' + ${cliente.nome} + '!'"></p>
        </div>

        <!-- Card de progresso premium -->
        <div class="bg-gradient-to-br from-primary-50 to-white border border-primary-100 rounded-2xl p-5 mb-5">

            <!-- Dots de progresso com animacao -->
            <div class="flex justify-center gap-2 flex-wrap mb-4 px-2">
                <span th:each="i : ${#numbers.sequence(1, empresa.visitasParaRecompensa)}"
                      th:styleappend="'animation-delay:' + ${i * 80} + 'ms'"
                      th:classappend="${i <= totalVisitas}
                          ? 'bg-primary shadow-sm shadow-primary/30'
                          : 'bg-gray-200'"
                      class="w-5 h-5 rounded-full inline-block dot-animated">
                </span>
            </div>

            <!-- Barra de progresso -->
            <div class="progress mb-2">
                <div class="progress-bar"
                     th:style="'width:' + ${totalVisitas * 100 / empresa.visitasParaRecompensa} + '%'">
                </div>
            </div>

            <p class="text-sm font-semibold text-gray-700">
                <span class="text-primary text-lg font-black" th:text="${totalVisitas}"></span>
                <span class="text-gray-400 font-normal"> / </span>
                <span th:text="${empresa.visitasParaRecompensa}"></span>
                <span class="text-gray-400 font-normal"> visitas</span>
            </p>
        </div>

        <!-- Pode resgatar -->
        <div th:if="${podeResgatar}" class="mb-5 animate-fade-in-up">
            <div class="bg-green-50 border border-green-200 rounded-xl px-4 py-3 mb-4">
                <p class="text-green-700 font-bold text-sm flex items-center justify-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/>
                    </svg>
                    Recompensa disponivel!
                </p>
                <p class="text-green-600 text-xs mt-0.5" th:if="${recompensa != null}"
                   th:text="'Voce ganhou: ' + ${recompensa.nome}"></p>
            </div>
            <form th:if="${recompensa != null}"
                  th:action="@{'/resgate/' + ${cliente.id} + '/' + ${recompensa.id}}"
                  method="post">
                <button type="submit"
                        class="w-full py-4 bg-green-600 hover:bg-green-700 text-white rounded-xl font-bold text-base cursor-pointer border-0 transition-colors animate-pulse-glow">
                    Resgatar agora
                </button>
            </form>
        </div>

        <!-- Faltam visitas -->
        <div th:if="${!podeResgatar}" class="mb-5">
            <p class="text-sm text-gray-400">
                Faltam
                <strong class="text-primary font-black"
                        th:text="${empresa.visitasParaRecompensa - totalVisitas}"></strong>
                visita(s) para sua recompensa
            </p>
        </div>

        <a th:href="@{'/c/' + ${empresa.id}}"
           class="text-sm text-primary hover:underline font-medium inline-flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
            Registrar outra visita
        </a>
    </div>
</div>

</body>
</html>
