<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Visita registrada')}"></head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4">

<div class="w-full max-w-sm">
    <div class="bg-white rounded-2xl p-6 shadow-sm text-center">

        <!-- Aviso: visita duplicada -->
        <div th:if="${aviso != null}">
            <p class="text-4xl mb-3">👋</p>
            <h2 class="text-xl font-bold text-gray-900 mb-1">
                Olá, <span th:text="${cliente.nome}"></span>!
            </h2>
            <p class="text-sm text-amber-600 bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 mt-3 mb-5"
               th:text="${aviso}"></p>
        </div>

        <!-- Sucesso: visita nova -->
        <div th:if="${aviso == null}">
            <p class="text-4xl mb-3">🎉</p>
            <h2 class="text-xl font-bold text-gray-900 mb-1">Visita registrada!</h2>
            <p class="text-gray-500 text-sm mb-5" th:text="'Obrigado, ' + ${cliente.nome} + '!'"></p>
        </div>

        <!-- Dots de progresso -->
        <div class="flex justify-center gap-2 flex-wrap mb-3 px-2">
            <span th:each="i : ${#numbers.sequence(1, empresa.visitasParaRecompensa)}"
                  th:classappend="${i <= totalVisitas}
                      ? 'bg-primary scale-110'
                      : 'bg-gray-200'"
                  class="w-4 h-4 rounded-full transition-all duration-300 inline-block">
            </span>
        </div>

        <!-- Barra de progresso -->
        <div class="progress mb-1">
            <div class="progress-bar"
                 th:style="'width:' + (${totalVisitas} * 100 / ${empresa.visitasParaRecompensa}) + '%'">
            </div>
        </div>
        <p class="text-sm font-semibold text-gray-600 mb-5">
            <span th:text="${totalVisitas}"></span>
            <span class="text-gray-400 font-normal"> / </span>
            <span th:text="${empresa.visitasParaRecompensa}"></span>
            <span class="text-gray-400 font-normal"> visitas</span>
        </p>

        <!-- Pode resgatar -->
        <div th:if="${podeResgatar}" class="mb-5">
            <div class="bg-success/10 border border-success/30 rounded-xl px-4 py-3 mb-4">
                <p class="text-success font-bold text-sm">🎁 Recompensa disponível!</p>
                <p class="text-success/70 text-xs mt-0.5" th:if="${recompensa != null}"
                   th:text="'Você ganhou: ' + ${recompensa.nome}"></p>
            </div>
            <form th:if="${recompensa != null}"
                  th:action="@{'/resgate/' + ${cliente.id} + '/' + ${recompensa.id}}"
                  method="post">
                <button type="submit"
                        class="w-full py-4 bg-success hover:opacity-90 text-white rounded-xl font-bold text-base cursor-pointer border-0">
                    Resgatar agora
                </button>
            </form>
        </div>

        <!-- Faltam visitas -->
        <div th:if="${!podeResgatar}" class="mb-5">
            <p class="text-sm text-gray-400">
                Faltam
                <strong class="text-gray-700"
                        th:text="${empresa.visitasParaRecompensa - totalVisitas}"></strong>
                visita(s) para sua recompensa
            </p>
        </div>

        <a th:href="@{'/c/' + ${empresa.id}}"
           class="text-sm text-primary hover:underline font-medium">
            Registrar outra visita
        </a>
    </div>
</div>

</body>
</html>
