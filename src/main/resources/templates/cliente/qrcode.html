<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Seu QR Code')}"></head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4">

<div class="w-full max-w-sm">
    <div class="bg-white rounded-2xl p-6 shadow-sm text-center">

        <p class="text-4xl mb-3">📱</p>
        <h2 class="text-xl font-bold text-gray-900 mb-1">Apresente este QR Code</h2>
        <p class="text-sm text-gray-400 mb-5">Mostre para o atendente confirmar sua recompensa</p>

        <div class="bg-gray-50 rounded-2xl p-4 inline-block mb-4">
            <img th:src="@{'https://api.qrserver.com/v1/create-qr-code/?size=240x240&data='
                + ${#httpServletRequest.scheme} + '://'
                + ${#httpServletRequest.serverName} + ':'
                + ${#httpServletRequest.serverPort}
                + '/validar/' + ${token}}"
                 alt="QR Code de resgate"
                 class="w-60 h-60 rounded-xl">
        </div>

        <p class="text-xs text-amber-600 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2">
            ⏱ Válido por 5 minutos
        </p>
    </div>
</div>

</body>
</html>
