<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Criar conta')}"></head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4 py-8">

<div class="w-full max-w-sm">
    <div class="text-center mb-8">
        <p class="text-primary font-bold text-2xl">Fidelize</p>
        <p class="text-gray-400 text-sm mt-1">Crie sua conta em 2 minutos</p>
    </div>

    <div class="bg-white rounded-2xl p-6 shadow-sm">

        <div th:if="${erro}"
             class="bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl px-4 py-3 mb-4"
             th:text="${erro}">
        </div>

        <form method="post">

            <p class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-3">Dados da empresa</p>

            <label>Nome da empresa</label>
            <input type="text" name="nomeEmpresa" placeholder="Ex: Barbearia do João" required>

            <label>Segmento</label>
            <select name="segmento" required>
                <option value="" disabled selected>Selecione o segmento</option>
                <option th:each="s : ${segmentos}"
                        th:value="${s}"
                        th:text="${s.name() == 'BARBEARIA' ? 'Barbearia' :
                                   s.name() == 'OFICINA'   ? 'Oficina mecânica' :
                                                             'Restaurante'}">
                </option>
            </select>

            <p class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-3 mt-2">Dados de acesso</p>

            <label>Usuário</label>
            <input type="text" name="username" placeholder="nome de usuário" required>

            <label>Senha</label>
            <input type="password" name="senha" placeholder="mínimo 6 caracteres" required>

            <button type="submit"
                    class="w-full py-4 bg-primary hover:opacity-90 text-white rounded-xl font-bold text-base cursor-pointer border-0 mt-2">
                Criar conta
            </button>
        </form>
    </div>

    <p class="text-center text-sm text-gray-400 mt-4">
        Já tem conta?
        <a href="/login" class="text-primary font-medium hover:underline">Entrar</a>
    </p>
</div>

</body>
</html>
