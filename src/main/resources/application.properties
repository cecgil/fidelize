spring.application.name=fidelize

# ── Gmail SMTP ──────────────────────────────────────────────────────────────
# Passo a passo para configurar:
#   1. Acesse sua conta Google → Segurança → Verificação em duas etapas (ativar)
#   2. Depois: Segurança → Senhas de app → criar senha para "Outro (fidelize)"
#   3. Preencha as propriedades abaixo com seu email e a senha de app gerada
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=SEU_EMAIL@gmail.com
spring.mail.password=SENHA_DE_APP_AQUI
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
